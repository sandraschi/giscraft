[package]
name = "giscraft"
version.workspace = true
edition = "2021"
description = "L3 native egui clone (QGIS muscle-memory shell, in-process dispatch)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "giscraft"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
tokio = { workspace = true }
giscraft-core = { path = "../giscraft-core" }
giscraft-store = { path = "../giscraft-store" }

[lints]
workspace = true

