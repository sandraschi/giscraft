[package]
name = "qgiscraft-mcp"
version = "0.1.0"
edition = "2021"
description = "CLI-first MCP server over stdio (thin frame around qgiscraft-core dispatch)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "qgiscraft-mcp"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
qgiscraft-core = { path = "../qgiscraft-core" }
qgiscraft-store = { path = "../qgiscraft-store" }

[lints]
workspace = true
