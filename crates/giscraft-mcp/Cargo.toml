[package]
name = "giscraft-mcp"
version.workspace = true
edition = "2021"
description = "CLI-first MCP server over stdio (thin frame around giscraft-core dispatch)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "giscraft-mcp"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
giscraft-core = { path = "../giscraft-core" }
giscraft-store = { path = "../giscraft-store" }

[lints]
workspace = true
